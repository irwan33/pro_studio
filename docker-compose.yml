services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: prostudio
      POSTGRES_PASSWORD: prostudio
      POSTGRES_DB: prostudio
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prostudio -d prostudio"]
      interval: 5s
      timeout: 5s
      retries: 10
  app:
    build: .
    command: npm run dev
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://prostudio:prostudio@postgres:5432/prostudio?schema=public
      JWT_ACCESS_SECRET: change-me-access-secret
      JWT_REFRESH_SECRET: change-me-refresh-secret
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    volumes:
      - .:/app
      - /app/node_modules
volumes:
  postgres_data:
